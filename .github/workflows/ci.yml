# .github/workflows/ci.yml - copy to each per-package repo's .github/workflows/
#
# Triggers: push to main, PRs to main, semver tags (stable + prerelease).
# Pinned tool versions per frameworks/manager/execution/conventions.md §5.

name: ci

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
          no-cache: true

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: lint
        run: bun run lint

      - name: test
        run: bun run test

      - name: scrub
        run: bash .github/scripts/scrub.sh .

      - name: build
        run: bun run build

      - name: determinism-check
        # Build twice; outputs must match byte-for-byte.
        run: |
          mv dist dist-1
          bun run build
          diff -r dist dist-1 || (echo "non-deterministic build" && exit 1)
          rm -rf dist-1

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
          no-cache: true

      - name: install
        run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: publish
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  gh-pages-deploy:
    needs: [verify, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
          no-cache: true

      - name: install-root
        run: bun install --frozen-lockfile

      - name: build-root
        run: bun run build

      - name: install-demo
        working-directory: demo
        run: bun install --frozen-lockfile

      - name: build-demo
        working-directory: demo
        env:
          VITE_BASE: /vBlocks/
        run: bun run build

      - name: publish-gh-pages
        run: |
          set -euo pipefail
          DEPLOY_DIR=$(mktemp -d)
          cp -R demo/dist/. "$DEPLOY_DIR/"
          touch "$DEPLOY_DIR/.nojekyll"
          cd "$DEPLOY_DIR"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "gh-pages: deploy ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
