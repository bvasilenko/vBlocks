  <title>@booga/vblocks - showcase</title>
  <script>
    (function () {
      var s = window.location.search;
      var p = new URLSearchParams(s).get('p');
      if (p) {
        var q = new URLSearchParams(s).get('q');
        var restored = p + (q ? '?' + decodeURIComponent(q) : '') + window.location.hash;
        window.history.replaceState(null, '', restored);
      }
    })();
  </script>
</head>

  <script type="module" src="/src/main.jsx"></script>
